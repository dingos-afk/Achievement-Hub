  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12

      - name: Build the site
        run: cd CompSci_Proj/Frontend && uvx --with requests drafter main.py --compile --output-directory ../../_site --production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
